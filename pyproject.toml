[tool.pytest.ini_options]
testpaths = ["tests"]
# 刻意不设 --basetemp：pytest 用它自己的临时目录机制会建 0o700 的目录，
# 在 Windows 受限沙箱里连读取都会被拒（详见 tests/conftest.py 的说明）。
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "data", "tests/.data", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]   # 脚本要先改 sys.path 再 import
